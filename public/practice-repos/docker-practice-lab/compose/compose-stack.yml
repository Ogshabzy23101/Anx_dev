services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build:
      context: ..
      dockerfile: dockerfiles/optimized.Dockerfile
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_URL: postgres://app:app@database:5432/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      - database
    networks:
      - app-net

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
    driver: bridge
